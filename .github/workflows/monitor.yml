name: 進場雷達盤中監控

# 開盤時間每 5 分鐘呼叫一次監控 API（UTC 時間）
#   08:00-23:59 平日：美股盤前 04:00 ET 到盤後
#   00:00-01:59 週二到週六：美股冬令時間的盤後
#   01:00-06:59 平日：台股 09:00-14:59
on:
  schedule:
    - cron: '*/5 8-23 * * 1-5'
    - cron: '*/5 0-1 * * 2-6'
    - cron: '*/5 1-6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: radar-monitor
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 呼叫監控 API
        run: |
          code=$(curl -sS -m 90 -o /tmp/out.json -w '%{http_code}' "${{ secrets.MONITOR_URL }}")
          echo "HTTP $code"
          head -c 800 /tmp/out.json
          test "$code" = "200"
