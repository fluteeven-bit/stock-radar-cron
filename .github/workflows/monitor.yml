name: 進場雷達監控（備援）

# ⚠⚠ 這條是「備援」，主力是 Cloudflare Workers Cron（每 5 分鐘）。
#
# ── 兩次實測，兩個結論 ──────────────────────────────────────────
# 2026-10-08：第一次量真實涵蓋率。設定是每半小時啟動連續跑 30 分鐘（約 46 趟/天），
#   GitHub 實際只給 3–6 趟，落在睡前視窗的 0 次，盤中只有 9.6%，而每天燒約 120 分鐘。
#   同一天的主力：Cloudflare 287 次/天、錯誤 0、24 小時全蓋。
#   → 改成「排在視窗前後、job 自己等到視窗打開才打」。
#
# 2026-10-19：那個改法<實測失敗>。11 天 7 趟，<沒有一趟落在睡前視窗>
#   （全部在美東 12:32–17:13 才啟動）。根因是 GitHub <不只是略過，它會晚 2–7 小時才跑>，
#   而那個設計建立在「只延遲 5–20 分鐘」這個<錯的假設>上。
#   省錢的部分成功了（每天約 1,300 分鐘 → 1 分鐘），但護不到睡前那一則。
#
# ── 所以：不要再去猜時間 ────────────────────────────────────────
# 👉 **讓備援不必準時**。打 `?brief=1`：哨兵<不管幾點被叫到，都把睡前那一則算出來發掉>，
#   而 <ntfy 的去重鍵是「每檔每天一則」> —— 主力已經發過的話就自動不發。
#   晚幾小時收到，遠比整天沒收到好；而主力正常時這條<完全不會多發一則>。
#
# ⚠ 用 `brief=1` 不用 `force=1`：force 會連監控清單那套巡邏一起強制
#   （忽略「今日未開盤」、強制讀最新清單、還會寫檔），備援不該有那些副作用。
# ⚠ 這個 repo 必須保持 PUBLIC（私有的話免費額度 2,000 分鐘擋不住）。
#   也因此<不可以把持倉成本之類的東西寫進這個檔案> —— 監控網址放在 repo secret。
# （舊的「等視窗」做法已經刪掉；要看的話在 git 歷史裡。）

on:
  schedule:
    # 一天兩次就夠：它只是補發「每天一則」的那一則，而且有去重。
    # ⚠ 刻意排在睡前視窗（美東 08:30–09:30）<之後>：主力正常的話今天那則早就發過了，
    #   這條就什麼都不會做 —— 那正是我們希望看到的結果。
    # ⚠ 排兩次是因為 GitHub 會延遲好幾小時；兩次都延遲到隔天的機率很低。
    - cron: '20 15 * * 1-5'
    - cron: '20 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: radar-monitor
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 補發睡前那一則（主力已經發過的話，去重會擋掉）
        env:
          URL: ${{ secrets.MONITOR_URL }}
        run: |
          set -u
          # ⚠ MONITOR_URL 本身已經帶了 ?key=…，所以這裡接的是 & 不是 ?
          code=$(curl -sS -m 120 -o /tmp/out.json -w '%{http_code}' "${URL}&brief=1" || echo 000)
          echo "HTTP $code"
          head -c 600 /tmp/out.json; echo
          # ⚠ 回 200 就算成功。這一趟<沒發出任何東西也是正常的> ——
          #   那表示主力已經發過了。「沒發」在這裡不是失敗。
          [ "$code" = "200" ]
